[workspace]
members = [
    "byte-utils",
    "can-port",
    "io-utils",
    "serial-port",
    "yamcs-bridge",
    "yamcs-derive",
]
resolver = "3"

[workspace.dependencies]
bytes = { version = "1.10", features = ["serde"] }
mio = { version = "1", features = ["os-poll", "os-ext"] }
nexosim = { git = "https://github.com/asynchronics/nexosim.git", rev = "7f0ee400104a64b9caedc0e67d0c6690c0440be6"}
nexosim-util = { git = "https://github.com/asynchronics/nexosim.git", rev = "7f0ee400104a64b9caedc0e67d0c6690c0440be6"}
tracing = { version = "0.1.40", default-features = false, features = ["std"] }
schematic = "0.18"
serde = "1"
thread-guard = "0.1.0"
